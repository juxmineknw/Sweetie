<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Welcome to My Portfolio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Mitr:wght@300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            --main-pink: #ffafcc;
            --dark-pink: #fb6f92;
            --bg-color: #fff0f3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            font-family: 'Poppins', 'Mitr', sans-serif;
            overflow: hidden;
        }

        /* ตกแต่งพื้นหลังแบบไล่สีวงกลม */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--main-pink);
            filter: blur(100px);
            border-radius: 50%;
            top: -50px;
            right: -50px;
            opacity: 0.5;
            z-index: -1;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.7);
            padding: 60px 40px;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(251, 111, 146, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            max-width: 450px;
            width: 90%;
        }

        .profile-gif {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 25px;
            border: 5px solid white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        h1 {
            color: var(--dark-pink);
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        p {
            color: #7d7d7d;
            font-size: 1rem;
            margin-bottom: 35px;
        }

        .enter-btn {
            display: inline-block;
            padding: 15px 45px;
            background: var(--dark-pink);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(251, 111, 146, 0.3);
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .enter-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(251, 111, 146, 0.5);
            background: #ff5c81;
        }

        .container {
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <div class="container">
        <img class="profile-gif" src="https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExcjh0b3FmeDA2YzA3mWFiODhudG9tZWIybmJuYXB6aWR4b2hlcXpwdiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9dg/jJjb9AUHOiP3nJJMdy/giphy-downsized-large.gif" alt="Welcome">
        
        <h1>Welcome to My World</h1>
        
        <a href="homepage_1.html" class="enter-btn">Explore Now</a>
    </div>

</body>

</html>
