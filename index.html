<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascend | My Private Space</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,700&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent-pink: #ffafcc;
            --deep-rose: #fb6f92;
            --soft-cream: #fff5f7;
            --glass: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #fff0f3 0%, #fde2e4 100%);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            color: #4a4a4a;
        }

        /* --- Animated Background Decoration --- */
        .bg-decoration {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .blob {
            position: absolute;
            background: linear-gradient(135deg, var(--accent-pink) 0%, var(--deep-rose) 100%);
            filter: blur(100px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.4;
            animation: floating 15s infinite alternate;
        }

        @keyframes floating {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, -50px) scale(1.2); }
        }

        /* --- Main Glass Container --- */
        .main-container {
            position: relative;
            z-index: 10;
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 100px 60px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 40px 100px rgba(251, 111, 146, 0.15);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }

        /* --- Typography --- */
        .welcome-text {
            font-size: 0.85rem;
            letter-spacing: 0.5rem;
            text-transform: uppercase;
            color: var(--deep-rose);
            margin-bottom: 20px;
            font-weight: 500;
            opacity: 0.8;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 30px;
            color: #2d2d2d;
        }

        .hero-title span {
            color: var(--deep-rose);
            font-style: italic;
        }

        .description {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #6d6d6d;
            margin-bottom: 50px;
            font-weight: 300;
        }

        /* --- Interactive Button --- */
        .btn-enter {
            position: relative;
            padding: 18px 50px;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.2rem;
            color: white;
            background: #2d2d2d;
            border: none;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            text-decoration: none;
            display: inline-block;
        }

        .btn-enter:hover {
            transform: translateY(-8px);
            background: var(--deep-rose);
            box-shadow: 0 20px 40px rgba(251, 111, 146, 0.4);
        }

        /* --- Decorative Particles --- */
        .sparkle {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            animation: shine 4s infinite;
        }

        @keyframes shine {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 0.8; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="bg-decoration">
        <div class="blob" style="width: 500px; height: 500px; top: -100px; left: -100px;"></div>
        <div class="blob" style="width: 400px; height: 400px; bottom: -50px; right: -50px; animation-delay: -5s;"></div>
    </div>

    <div class="main-container">
        <p class="welcome-text">Now Entering</p>
        <h1 class="hero-title">Beyond the <span>Horizon</span></h1>
        
        <p class="description">
            Step into a curated collection of thoughts, designs, and digital footprints. 
            A space where aesthetics meets functionality.
        </p>
        
        <a href="homepage_1.html" class="btn-enter">Begin Journey</a>
    </div>

    <script>
        function createSparkles() {
            const body = document.body;
            for (let i = 0; i < 20; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                const size = Math.random() * 5 + 2;
                sparkle.style.width = `${size}px`;
                sparkle.style.height = `${size}px`;
                sparkle.style.left = `${Math.random() * 100}%`;
                sparkle.style.top = `${Math.random() * 100}%`;
                sparkle.style.animationDelay = `${Math.random() * 5}s`;
                body.appendChild(sparkle);
            }
        }
        createSparkles();
    </script>
</body>
</html>
